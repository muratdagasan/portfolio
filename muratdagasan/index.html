<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murat Dağasan — Fotoğraf</title>
<meta name="description" content="Murat Dağasan fotoğraf portfolyosu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1ee;--ink:#141516;--mute:#76736d;--line:#d9d6cf;--card:#e4e2dc}
@media(prefers-color-scheme:dark){:root{--bg:#121314;--ink:#efede8;--mute:#8d8a84;--line:#2a2b2c;--card:#1b1c1d}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "Newsreader",Georgia,serif}
a{color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);font:500 14px "Bricolage Grotesque",sans-serif}
header nav{display:flex;gap:22px}
header a{text-decoration:none}
header a:hover{text-decoration:underline;text-underline-offset:4px}
.hero{padding:9vh 5vw 5vh}
.hero h1{font:300 clamp(48px,13vw,168px)/.92 "Bricolage Grotesque",sans-serif;letter-spacing:-.045em}
.hero p{margin-top:22px;font-style:italic;color:var(--mute);font-size:19px}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 5vw 24px;font:500 14px "Bricolage Grotesque",sans-serif}
.filters button{font:inherit;color:var(--mute);background:none;border:1px solid var(--line);border-radius:99px;padding:7px 16px;cursor:pointer}
.filters button.on,.filters button:hover{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.grid{columns:3 280px;column-gap:14px;padding:0 5vw}
.grid figure{break-inside:avoid;margin:0 0 14px;background:var(--card);cursor:zoom-in;position:relative;overflow:hidden}
.grid img{display:block;width:100%;height:auto;transition:transform .6s,opacity .4s}
.grid figure:hover img{transform:scale(1.03)}
.grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;font:500 13px "Bricolage Grotesque",sans-serif;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .3s}
.grid figure:hover figcaption{opacity:1}
.empty{padding:10vh 5vw;color:var(--mute);font-style:italic;font-size:19px}
section.s{display:grid;grid-template-columns:1fr 2fr;gap:5vw;padding:12vh 5vw;border-top:1px solid var(--line);margin-top:10vh}
section.s h2{font:500 14px "Bricolage Grotesque",sans-serif;color:var(--mute)}
section.s p{font-size:clamp(20px,2.6vw,30px);line-height:1.4;max-width:34ch}
.links{display:flex;gap:24px;margin-top:28px;font:500 15px "Bricolage Grotesque",sans-serif}
footer{padding:24px 5vw 40px;color:var(--mute);font:400 13px "Bricolage Grotesque",sans-serif}
#lb{position:fixed;inset:0;z-index:20;background:rgba(10,10,10,.96);display:none;align-items:center;justify-content:center;flex-direction:column;padding:4vh 3vw}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:82vh;object-fit:contain}
#lb p{color:#bbb;margin-top:12px;font:400 14px "Bricolage Grotesque",sans-serif}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:16px}
#lb .x{top:6px;right:10px}#lb .p{left:6px;top:45%}#lb .n{right:6px;top:45%}
@media(max-width:700px){section.s{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><a href="#" id="logo"></a><nav><a href="#galeri">Galeri</a><a href="#hakkimda">Hakkımda</a><a href="#iletisim">İletişim</a></nav></header>
<div class="hero"><h1 id="name"></h1><p id="tag"></p></div>
<div class="filters" id="filters"></div>
<main class="grid" id="galeri"></main>
<section class="s" id="hakkimda"><h2>Hakkımda</h2><p id="bio"></p></section>
<section class="s" id="iletisim" style="margin-top:0"><h2>İletişim</h2><div><p>Çekim ve iş birliği için yaz.</p><div class="links" id="links"></div></div></section>
<footer id="foot"></footer>
<div id="lb"><button class="x" aria-label="Kapat">×</button><button class="p" aria-label="Önceki">‹</button><img alt=""><button class="n" aria-label="Sonraki">›</button><p></p></div>
<script>
let D,list=[],cur=0;
const $=s=>document.querySelector(s);
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;init()}).catch(()=>{$('#galeri').innerHTML='<p class="empty">data.json yüklenemedi.</p>'});
function init(){
 const s=D.site;document.title=s.name+' — '+s.tagline;
 $('#logo').textContent=s.name;$('#name').textContent=s.name;$('#tag').textContent=s.tagline;$('#bio').textContent=s.bio;
 const l=$('#links');
 if(s.instagram)l.innerHTML+=`<a href="https://instagram.com/${s.instagram}" target="_blank" rel="noopener">Instagram</a>`;
 if(s.email)l.innerHTML+=`<a href="mailto:${s.email}">${s.email}</a>`;
 $('#foot').textContent='© '+new Date().getFullYear()+' '+s.name;
 const f=$("#filters");
 const cats=['Tümü',...(D.categories||[]).filter(c=>D.photos.some(p=>p.cat===c))];
 f.innerHTML=D.photos.length&&cats.length>2?cats.map((c,i)=>`<button class="${i?'':'on'}">${c}</button>`).join(''):'';
 f.onclick=e=>{if(e.target.tagName!=='BUTTON')return;[...f.children].forEach(b=>b.classList.toggle('on',b===e.target));show(e.target.textContent)};
 show('Tümü');
}
function show(c){
 list=D.photos.filter(p=>c==='Tümü'||p.cat===c);
 const g=$('main');
 g.innerHTML=list.length?list.map((p,i)=>`<figure data-i="${i}"><img loading="lazy" src="photos/${p.file}" alt="${p.title||''}">${p.title?`<figcaption>${p.title}</figcaption>`:''}</figure>`).join(''):'<p class="empty">Henüz fotoğraf yok. Yönetici panelinden (admin.html) ilk fotoğrafını ekle.</p>';
}
$('main').onclick=e=>{const f=e.target.closest('figure');if(f)open(+f.dataset.i)};
const lb=$('#lb');
function open(i){cur=(i+list.length)%list.length;const p=list[cur];lb.querySelector('img').src='photos/'+p.file;lb.querySelector('p').textContent=p.title||'';lb.classList.add('open')}
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');
lb.querySelector('.p').onclick=()=>open(cur-1);
lb.querySelector('.n').onclick=()=>open(cur+1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')open(cur-1);if(e.key==='ArrowRight')open(cur+1)});
let tx=0;lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX);lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)open(cur+(d<0?1:-1))});
</script>
</body>
</html>
